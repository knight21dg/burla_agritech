# nginx in front of the two Node processes.
# Copy to /etc/nginx/sites-available/burla.conf and link into sites-enabled.
#
# The TLS lines are added by certbot; run it after this file is in place and
# it will rewrite the two server blocks to listen on 443 and redirect 80.

# --- the customer site ------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name burla.co.in www.burla.co.in;

    # A photograph from a phone can be several megabytes, and nginx refuses
    # anything over 1MB by default — which arrives as a failed upload with no
    # useful message. The application's own limit is 10MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- the admin --------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.burla.co.in;

    client_max_body_size 12M;

    # Worth considering once the client has a fixed office address: uncomment
    # and the admin answers nobody else. Sign-in still applies either way.
    # allow 203.0.113.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
